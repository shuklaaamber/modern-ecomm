name: db-backup
on:
  schedule: [{ cron: "17 2 * * *" }] # daily, 02:17 UTC
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      # Repo secrets: BACKUP_DATABASE_URL (DIRECT, non-pooler Neon URL), R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
      # R2_SECRET_ACCESS_KEY, R2_BUCKET. Optional BACKUP_HEALTHCHECK_URL.
      - name: Install matching pg_dump
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - name: Dump
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          out="threadco-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
          /usr/lib/postgresql/17/bin/pg_dump --no-owner --no-privileges "$BACKUP_DATABASE_URL" | gzip > "$out"
          test "$(stat -c%s "$out")" -gt 2000 # refuse an obviously empty dump
          echo "BACKUP_FILE=$out" >> "$GITHUB_ENV"
      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: aws s3 cp "$BACKUP_FILE" "s3://${{ secrets.R2_BUCKET }}/backups/$BACKUP_FILE" --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
      - name: Heartbeat
        env:
          URL: ${{ secrets.BACKUP_HEALTHCHECK_URL }}
        run: '[ -z "$URL" ] || curl -fsS --retry 3 --max-time 10 "$URL"'
