name: release-expired-reservations
on:
  schedule: [{ cron: "*/10 * * * *" }] # best effort; GitHub may delay scheduled runs
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Repo secrets: APP_URL (https://your-domain, no trailing slash) and CRON_SECRET (same as the server's).
      # Optional HEALTHCHECK_URL (healthchecks.io / Better Stack heartbeat): pinged only after a successful run,
      # so a missed or failing run triggers the monitor's alert.
      - run: curl -fsS --max-time 30 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.APP_URL }}/api/cron/release"
      - name: Heartbeat
        env:
          URL: ${{ secrets.HEALTHCHECK_URL }}
        run: '[ -z "$URL" ] || curl -fsS --retry 3 --max-time 10 "$URL"'
